packages:
  - apps/*
  - packages/*

allowBuilds:
  argon2: true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

# Patched transitive versions required by FP-003B public-facing security gates.
overrides:
  source-map-js: ^1.2.2
  sharp: ^0.35.5

# Temporary picomatch 4.0.7 advisory exception (Vitest/Vite toolchain AND
# TypeORM -> tinyglobby dependency present in the production API image).
# The dedicated API Trivy exception expires 2026-12-02; this pnpm audit.ignore
# has NO auto-expiry. Review weekly and remove BOTH after a tested upstream fix.
# This is synthetic-Staging risk acceptance, not proof of unreachability.
audit:
  ignore:
    - GHSA-fc5q-39xc-vjpf
