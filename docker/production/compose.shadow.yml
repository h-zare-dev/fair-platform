# Owner-activated second-webhook pilot only. Never pass this file to the
# regular installation/update command without a new Owner authorization.
services:
  owner-api:
    environment:
      FAIR_SHADOW_ENABLED: 'true'
      FAIR_SHADOW_CLOSE_TIME: '02:10'
      FAIR_SHADOW_DELETE_CREDIT_ENABLED: ${FAIR_SHADOW_DELETE_CREDIT_ENABLED:-false}
      APP_ENCRYPTION_KEY_FILE: /run/secrets/seed_encryption_key
      PASARGUARD_WEBHOOK_SECRET_FILE: /run/secrets/shadow_webhook_secret
      PASARGUARD_BASE_URL: ${PASARGUARD_BASE_URL:?directory URL required}
      PASARGUARD_API_KEY_FILE: /run/secrets/pasarguard_api_key
    secrets: [seed_encryption_key, shadow_webhook_secret, pasarguard_api_key]

secrets:
  seed_encryption_key:
    file: ${SECRETS_DIR:?}/seed_encryption_key
  shadow_webhook_secret:
    file: ${SECRETS_DIR:?}/shadow_webhook_secret
  pasarguard_api_key:
    file: ${SECRETS_DIR:?}/pasarguard_api_key
