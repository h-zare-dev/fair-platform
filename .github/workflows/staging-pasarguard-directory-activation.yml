name: Staging PasarGuard read-only admin directory activation (Owner only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ACTIVATE_PASARGUARD_ADMIN_DIRECTORY to approve the exact read-only Staging connection'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fair-staging-deployment
  cancel-in-progress: false

jobs:
  activate:
    if: >-
      github.ref == 'refs/heads/development' &&
      github.ref_protected &&
      github.actor == 'h-zare-dev' &&
      inputs.confirmation == 'ACTIVATE_PASARGUARD_ADMIN_DIRECTORY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging-bootstrap
    steps:
      - name: Checkout reviewed protected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Provision only read-only directory secret and approved Compose delta
        env:
          HOST: ${{ secrets.STAGING_BOOTSTRAP_HOST }}
          HOSTKEY_SHA256: ${{ secrets.STAGING_BOOTSTRAP_HOSTKEY_SHA256 }}
          SSHPASS: ${{ secrets.STAGING_BOOTSTRAP_ROOT_PASSWORD }}
          PASARGUARD_API_KEY: ${{ secrets.PASARGUARD_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import ipaddress, os, re
          address = ipaddress.ip_address(os.environ['HOST'])
          assert address.version == 4 and address.is_global
          assert os.environ['SSHPASS']
          assert re.fullmatch(r'SHA256:[A-Za-z0-9+/]{43}', os.environ['HOSTKEY_SHA256'])
          assert re.fullmatch(r'pg_key_[A-Za-z0-9_-]{12,480}', os.environ['PASARGUARD_API_KEY'])
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          work=$(mktemp -d)
          ssh_opts=(-T -p 22 -o StrictHostKeyChecking=yes -o BatchMode=no
                    -o NumberOfPasswordPrompts=1 -o PreferredAuthentications=password
                    -o PubkeyAuthentication=no -o "UserKnownHostsFile=$work/known_hosts"
                    -o ConnectTimeout=15 -o LogLevel=ERROR)
          scp_opts=(-T -P 22 -o StrictHostKeyChecking=yes -o BatchMode=no
                    -o NumberOfPasswordPrompts=1 -o PreferredAuthentications=password
                    -o PubkeyAuthentication=no -o "UserKnownHostsFile=$work/known_hosts"
                    -o ConnectTimeout=15 -o LogLevel=ERROR)
          cleanup() {
            sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" \
              'rm -f -- /opt/fair-staging/tooling/directory-proposed-compose.yml' \
              >/dev/null 2>&1 || true
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          ssh-keyscan -T 12 -p 22 -t ed25519 "$HOST" > "$work/known_hosts" 2>/dev/null
          actual=$(ssh-keygen -lf "$work/known_hosts" -E sha256 | awk '{print $2}')
          [[ "$actual" == "$HOSTKEY_SHA256" ]] || { echo PINNED_SSH_HOST_KEY_MISMATCH; exit 1; }

          sshpass -e scp -q "${scp_opts[@]}" \
            scripts/staging/activate-pasarguard-directory.py \
            "root@$HOST:/opt/fair-staging/tooling/activate-pasarguard-directory.py" \
            2>"$work/ssh-error" || { echo STAGING_DIRECTORY_TOOL_COPY_FAILED; exit 1; }
          sshpass -e scp -q "${scp_opts[@]}" \
            docker/staging/compose.yml \
            "root@$HOST:/opt/fair-staging/tooling/directory-proposed-compose.yml" \
            2>"$work/ssh-error" || { echo STAGING_DIRECTORY_CONFIG_COPY_FAILED; exit 1; }
          sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" \
            'chown root:root /opt/fair-staging/tooling/activate-pasarguard-directory.py /opt/fair-staging/tooling/directory-proposed-compose.yml && chmod 0700 /opt/fair-staging/tooling/activate-pasarguard-directory.py && chmod 0600 /opt/fair-staging/tooling/directory-proposed-compose.yml' \
            2>"$work/ssh-error" || { echo STAGING_DIRECTORY_TOOL_PERMISSIONS_FAILED; exit 1; }

          # A protected GitHub secret is streamed over pinned encrypted SSH stdin.
          # It is never an argv value, image layer, Compose env value, or log line.
          printf '%s' "$PASARGUARD_API_KEY" | sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" \
            "python3 /opt/fair-staging/tooling/activate-pasarguard-directory.py $GITHUB_SHA /opt/fair-staging/tooling/directory-proposed-compose.yml" \
            2>"$work/ssh-error" || {
              grep -E '^STAGING_[A-Z0-9_]+$' "$work/ssh-error" | head -n 1 || true
              echo STAGING_DIRECTORY_OPERATOR_APPROVAL_FAILED
              exit 1
            }
          unset PASARGUARD_API_KEY
          echo 'Staging now holds the verified read-only PasarGuard key and exact Owner-approved Compose config. No app or DB was restarted. Re-run only the failed Deploy job from the latest development CI run; then log in to verify the Admin picker.' >> "$GITHUB_STEP_SUMMARY"
