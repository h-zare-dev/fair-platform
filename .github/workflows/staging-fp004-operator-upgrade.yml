name: Staging FP-004 config and schema approval (Owner only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type APPROVE_FP004_STAGING_UPGRADE to approve exactly the Tehran timezone mapping and additive AtomicCatalog migration'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fair-staging-deployment
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.ref == 'refs/heads/development' &&
      github.ref_protected &&
      github.actor == 'h-zare-dev' &&
      inputs.confirmation == 'APPROVE_FP004_STAGING_UPGRADE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging-bootstrap
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout reviewed protected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Approve only the reviewed staging config and additive migration
        env:
          HOST: ${{ secrets.STAGING_BOOTSTRAP_HOST }}
          HOSTKEY_SHA256: ${{ secrets.STAGING_BOOTSTRAP_HOSTKEY_SHA256 }}
          SSHPASS: ${{ secrets.STAGING_BOOTSTRAP_ROOT_PASSWORD }}
          GH_PACKAGES_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import ipaddress, os, re
          address=ipaddress.ip_address(os.environ['HOST'])
          assert address.version == 4 and address.is_global
          assert os.environ['SSHPASS']
          assert re.fullmatch(r'SHA256:[A-Za-z0-9+/]{43}', os.environ['HOSTKEY_SHA256'])
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          work=$(mktemp -d)
          registry_logged_in=false
          ssh_opts=(-T -p 22 -o StrictHostKeyChecking=yes -o BatchMode=no
                    -o NumberOfPasswordPrompts=1 -o PreferredAuthentications=password
                    -o PubkeyAuthentication=no -o "UserKnownHostsFile=$work/known_hosts"
                    -o ConnectTimeout=15 -o LogLevel=ERROR)
          scp_opts=(-T -P 22 -o StrictHostKeyChecking=yes -o BatchMode=no
                    -o NumberOfPasswordPrompts=1 -o PreferredAuthentications=password
                    -o PubkeyAuthentication=no -o "UserKnownHostsFile=$work/known_hosts"
                    -o ConnectTimeout=15 -o LogLevel=ERROR)
          cleanup() {
            if [[ "$registry_logged_in" == true ]]; then
              sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" \
                'bash /opt/fair-staging/tooling/registry-temporary.sh logout' >/dev/null 2>&1 || true
            fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          ssh-keyscan -T 12 -p 22 -t ed25519 "$HOST" > "$work/known_hosts" 2>/dev/null
          actual=$(ssh-keygen -lf "$work/known_hosts" -E sha256 | awk '{print $2}')
          [[ "$actual" == "$HOSTKEY_SHA256" ]] || { echo PINNED_SSH_HOST_KEY_MISMATCH; exit 1; }

          # Upload only a reviewed root-owned operator script, not settings or secrets.
          sshpass -e scp -q "${scp_opts[@]}" scripts/staging/approve-fp004-upgrade.py \
            "root@$HOST:/opt/fair-staging/tooling/approve-fp004-upgrade.py" \
            2>"$work/ssh-error" || { echo STAGING_OPERATOR_TOOL_INSTALL_FAILED; exit 1; }
          sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" \
            'chown root:root /opt/fair-staging/tooling/approve-fp004-upgrade.py && chmod 0700 /opt/fair-staging/tooling/approve-fp004-upgrade.py' \
            2>"$work/ssh-error" || { echo STAGING_OPERATOR_TOOL_PERMISSIONS_FAILED; exit 1; }
          printf '%s' "$GH_PACKAGES_READ_TOKEN" | sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" \
            'bash /opt/fair-staging/tooling/registry-temporary.sh login' \
            2>"$work/ssh-error" || { echo STAGING_GHCR_TRANSIENT_AUTH_FAILED; exit 1; }
          unset GH_PACKAGES_READ_TOKEN
          registry_logged_in=true

          # The exact reviewed Compose bytes enter on stdin. Host-side validation
          # rejects every other config change and any migration hash drift.
          sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" \
            "python3 /opt/fair-staging/tooling/approve-fp004-upgrade.py $GITHUB_SHA" \
            < docker/staging/compose.yml 2>"$work/ssh-error" || {
              echo STAGING_FP004_OPERATOR_REVIEW_FAILED
              exit 1
            }
          sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" \
            'bash /opt/fair-staging/tooling/registry-temporary.sh logout' \
            2>"$work/ssh-error" || { echo STAGING_GHCR_AUTH_CLEANUP_FAILED; exit 1; }
          registry_logged_in=false
          echo 'The ordinary protected-branch CI deploy must now be re-run; no database migration or service restart was performed by this approval.' >> "$GITHUB_STEP_SUMMARY"
