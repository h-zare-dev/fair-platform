name: Temporary Queue Formatting Preview
on:
  push:
    branches: [recovery/ops-068-c1e2febb12a3]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Print formatted diff without writing to GitHub
        run: |
          pnpm exec prettier --write scripts/orchestrator/queue.ts tests/orchestrator/queue.test.ts
          echo '__QUEUE_PRETTIER_DIFF_BEGIN__'
          git diff --no-ext-diff -- scripts/orchestrator/queue.ts tests/orchestrator/queue.test.ts
          echo '__QUEUE_PRETTIER_DIFF_END__'
