name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false

      - name: Setup pnpm 12.6.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - name: Dependency and secret scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: node_modules,.git

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      config-hash: ${{ steps.config.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/h-zare-dev/fair-platform
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/h-zare-dev/fair-platform-owner-api:${{ github.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/h-zare-dev/fair-platform
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/h-zare-dev/fair-platform-web:${{ github.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.caddy
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/h-zare-dev/fair-platform
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/h-zare-dev/fair-platform-caddy:${{ github.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.postgres
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/h-zare-dev/fair-platform
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/h-zare-dev/fair-platform-postgres:${{ github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Browser acceptance on local synthetic containers
        env:
          UI_API_IMAGE: ghcr.io/h-zare-dev/fair-platform-owner-api:${{ github.sha }}
          UI_POSTGRES_IMAGE: ghcr.io/h-zare-dev/fair-platform-postgres:${{ github.sha }}
          UI_CADDY_IMAGE: ghcr.io/h-zare-dev/fair-platform-caddy:${{ github.sha }}
          UI_WEB_IMAGE: ghcr.io/h-zare-dev/fair-platform-web:${{ github.sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test:prepare
          pnpm exec playwright install --with-deps chromium
          pnpm test:web
          sudo apt-get update -qq
          sudo apt-get install -y age rclone
          pnpm test:backup
          RELEASE_TEST_POSTGRES_IMAGE=ghcr.io/h-zare-dev/fair-platform-postgres:${{ github.sha }} FAIR_RELEASE_DOCKER_TEST=1 python3 -m unittest discover -s tests/release -p test_compose.py
      - name: Scan API image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/h-zare-dev/fair-platform-owner-api:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan Web image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/h-zare-dev/fair-platform-web:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan Caddy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/h-zare-dev/fair-platform-caddy:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan PostgreSQL
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/h-zare-dev/fair-platform-postgres:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: SBOM API
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/h-zare-dev/fair-platform-owner-api:${{ github.sha }}
          format: cyclonedx
          output: api.sbom.json
      - name: SBOM Web
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/h-zare-dev/fair-platform-web:${{ github.sha }}
          format: cyclonedx
          output: web.sbom.json
      - name: SBOM Caddy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/h-zare-dev/fair-platform-caddy:${{ github.sha }}
          format: cyclonedx
          output: caddy.sbom.json
      - name: SBOM PostgreSQL
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ghcr.io/h-zare-dev/fair-platform-postgres:${{ github.sha }}
          format: cyclonedx
          output: postgres.sbom.json
      - name: Validate Compose and Caddy
        run: |
          API_IMAGE=local:test WEB_IMAGE=local:test CADDY_IMAGE=local:test POSTGRES_IMAGE=local:test ACME_EMAIL=operator@example.invalid SECRETS_DIR=/tmp/fair-secrets docker compose -f docker/staging/compose.yml config --quiet
          docker run --rm --network none -e ACME_EMAIL=operator@example.invalid -v "$PWD/docker/staging/Caddyfile:/etc/caddy/Caddyfile:ro" ghcr.io/h-zare-dev/fair-platform-caddy:${{ github.sha }} caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - id: config
        run: echo "hash=$(python3 scripts/staging/config-hash.py)" >> "$GITHUB_OUTPUT"
      - name: Save scanned images
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        run: docker save ghcr.io/h-zare-dev/fair-platform-owner-api:${{ github.sha }} ghcr.io/h-zare-dev/fair-platform-web:${{ github.sha }} ghcr.io/h-zare-dev/fair-platform-caddy:${{ github.sha }} ghcr.io/h-zare-dev/fair-platform-postgres:${{ github.sha }} -o images.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        with:
          name: scanned-images
          path: images.tar
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-sboms
          path: '*.sbom.json'
          retention-days: 30

  owner-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.verify.outputs.authorized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/staging/verify-owner-merge.py

  publish:
    needs: [quality, security, containers, owner-merge]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && needs.owner-merge.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      api: ${{ steps.digests.outputs.api }}
      web: ${{ steps.digests.outputs.web }}
      caddy: ${{ steps.digests.outputs.caddy }}
      postgres: ${{ steps.digests.outputs.postgres }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scanned-images
      - run: docker load -i images.tar
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: digests
        run: |
          for service in owner-api web caddy postgres; do
            image="ghcr.io/h-zare-dev/fair-platform-$service:${{ github.sha }}"
            docker push "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            if [ "$service" = owner-api ]; then key=api; else key="$service"; fi
            printf '%s=%s\n' "$key" "$digest" >> "$GITHUB_OUTPUT"
          done

  deploy:
    needs: [publish, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && github.ref_protected && vars.FP003B_STAGING_ACTIVATED == 'owner-approved-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: fair-staging-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Immutable release manifest
        env:
          API: ${{ needs.publish.outputs.api }}
          WEB: ${{ needs.publish.outputs.web }}
          CADDY: ${{ needs.publish.outputs.caddy }}
          POSTGRES: ${{ vars.FP003B_POSTGRES_IMAGE }}
          CONFIG_HASH: ${{ needs.containers.outputs.config-hash }}
        run: |
          python3 - <<'PYMANIFEST'
          import json, os
          from pathlib import Path
          Path('release.json').write_text(json.dumps({'sha':os.environ['GITHUB_SHA'],'api':os.environ['API'],'web':os.environ['WEB'],'caddy':os.environ['CADDY'],'postgres':os.environ['POSTGRES'],'schema':'fp003b-v1','configHash':os.environ['CONFIG_HASH']}))
          PYMANIFEST
      - name: Scan operator-selected immutable PostgreSQL image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ${{ vars.FP003B_POSTGRES_IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Protected staging activation and pinned SSH delivery
        env:
          STAGING_ACTIVATION: ${{ secrets.STAGING_ACTIVATION }}
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/staging/ci-ssh.sh
      - name: Release evidence
        if: always()
        run: if [ -f release.json ]; then cat release.json >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Sanitized failure alert
        if: failure()
        run: echo 'STAGING_DEPLOY_FAILED — Owner intervention may be required. See restricted host diagnostics.' >> "$GITHUB_STEP_SUMMARY"
